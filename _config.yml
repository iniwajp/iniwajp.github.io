title: iniwajp Blog
email: s@iniwa.jp
description: iniwajp ブログ
permalink: /blog/:title/

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

url: "https://iniwa.jp"
baseurl: ""
twitter_username: iniwajp
github_username:  iniwajp

# Build settings
#theme: minima
plugins:
  - jekyll-feed
feed:
  path: blog/feed.xml

